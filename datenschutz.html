<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Datenschutzerklärung — Dispocall</title>
  <meta name="description" content="Datenschutzerklärung der Dispocall-Plattform für Taxi-Unternehmen.">
  <link rel="stylesheet" href="/style.css">
  <!-- marked.js — Markdown-Renderer, CDN-CSP-konform, ohne externe Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">Dispocall</a>
      <nav>
        <a href="/datenschutz">Datenschutz</a>
        <a href="/agb">AGB</a>
        <a href="/impressum">Impressum</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    <div id="markdown-content">
      <div class="loading-state">Wird geladen…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Dispocall · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a> · <a href="/agb">AGB</a></p>
    </div>
  </footer>

  <script>
    // Source of truth ist die Markdown-Datei — HTML rendert sie nur.
    // So bleibt bei späteren Updates nur die .md zu pflegen, nie das HTML.
    (async () => {
      const target = document.getElementById('markdown-content');
      try {
        const resp = await fetch('/datenschutz.md', { cache: 'no-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const md = await resp.text();
        target.innerHTML = marked.parse(md);
        // Update document title to the first H1 of the rendered content
        const h1 = target.querySelector('h1');
        if (h1) document.title = h1.textContent + ' — Dispocall';
      } catch (e) {
        target.innerHTML = '<div class="error-state">Inhalt konnte nicht geladen werden. Bitte später erneut versuchen.</div>';
        console.error('[legal] failed to load datenschutz.md', e);
      }
    })();
  </script>
</body>
</html>
